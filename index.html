﻿<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="mapContainer"></div>

<div id="toggle" class="toggle"></div>
<div id="score">0/135 | 0%</div>
<div id="quizInstruction" style="font-size:18px; font-weight:bold; margin-bottom:5px;"></div>

<div id="modeSelector">
    <label for="mode">Modus:</label>
    <select id="mode">
        <option value="quiz">Quiz</option>
        <option value="lernen">Lernen</option>
    </select>
</div>

<div id="mapSelector">
    <label for="mapSelect">Map:</label>
    <select id="mapSelect">
        <option value="default">Standard</option>
    </select>
    <button id="addMapBtn">+</button>
    <button id="deleteMapBtn" style="display:none;" title="Map löschen">
            <svg width="18" height="18" viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <path d="M10 11v6"/>
                <path d="M14 11v6"/>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
    </button>
    <button id="toggleMapBtn" title="Alle Gemeinden markieren / zurücksetzen">🗺️</button>
    <button id="mouseBtn" title="Tooltip Einstellungen">⚙️</button>
    <button id="soundToggleBtn" title="Sound an/aus">🔊</button>
    <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="1" style="width:100px;">

</div>



<!-- Tooltip Einstellungen Modal -->
<div id="tooltipModal" class="modal">
    <div class="modalContent">
        <h3>Tooltip Einstellungen</h3>

        <div style="margin-top:10px;">
            <h4>Provinz-spezifische Anpassungen</h4>
            <div id="provinceTooltipList"></div>
        </div>

        <button id="saveTooltipBtn">Speichern</button>
        <button id="cancelTooltipBtn">Abbrechen</button>
    </div>
</div>



<!-- Overlay Fenster -->
<div id="mapModal" class="modal">
    <div class="modalContent">
        <h3>Custom Map erstellen</h3>

        <div id="regionProvinceList"></div>

        <button id="saveMapBtn">Speichern</button>
        <button id="cancelMapBtn">Abbrechen</button>
    </div>
</div>


<script src="js/state.js" defer></script>
<script src="js/sound.js" defer></script>
<script src="js/maps.js" defer></script>
<script src="js/tooltip-settings.js" defer></script>
<script src="js/quiz.js" defer></script>
<script src="js/svg-loader.js" defer></script>
</body>
</html>
